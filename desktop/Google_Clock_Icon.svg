<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Clock Icon">
  <defs>
    
    <radialGradient id="clock-face-grad" cx="50" cy="48" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--clock-center, #9EBDFC)" />
      <stop offset="45%" stop-color="var(--clock-mid, #6F92FB)" />
      <stop offset="82%" stop-color="var(--clock-outer, #456EF7)" />
      <stop offset="100%" stop-color="var(--clock-edge, #3B64F2)" />
    </radialGradient>

    
    <linearGradient id="clock-minute-grad" x1="48" y1="54" x2="64" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--clock-minute-base, #FF9CD0)" />
      <stop offset="28%" stop-color="var(--clock-minute-mid, #FFD3EA)" />
      <stop offset="52%" stop-color="var(--clock-minute-tip, #FFFFFF)" />
      <stop offset="100%" stop-color="var(--clock-minute-tip, #FFFFFF)" />
    </linearGradient>
  </defs>

  
  <circle cx="50" cy="50" r="48" fill="url(#clock-face-grad)" />

  
  <line x1="50" y1="50" x2="61" y2="71" stroke="var(--clock-hour, #1A1E46)" stroke-width="19.5" stroke-linecap="round" />

  
  <line x1="50" y1="50" x2="64" y2="20" stroke="url(#clock-minute-grad)" stroke-width="10" stroke-linecap="round" />
</svg>